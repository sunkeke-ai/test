name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages from master /docs when it is not already on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Attempting to create the Pages site from master /docs"
          gh api --method POST "/repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'JSON'
          {
            "build_type": "legacy",
            "source": {
              "branch": "master",
              "path": "/docs"
            }
          }
          JSON
          echo "POST exit: $?"
          echo "Current Pages site:"
          gh api "/repos/${{ github.repository }}/pages" || true

      - name: Upload invite
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
